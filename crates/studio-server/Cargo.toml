[package]
name = "tuning-studio-server"
version = "0.1.1"
description = "The studio backend over stdio, for the VS Code extension"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true

[[bin]]
name = "studio-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
studio-app = { package = "tuning-studio-app", path = "../studio-app", version = "0.1.1" }
studio-carriers = { package = "tuning-studio-carriers", path = "../studio-carriers", version = "0.1.1" }
studio-core = { package = "tuning-studio-core", path = "../studio-core", version = "0.1.1" }
studio-dwarf = { package = "tuning-studio-dwarf", path = "../studio-dwarf", version = "0.1.1" }

[dev-dependencies]
tempfile = "3"
